name: 🐛 Bug Report
description: 버그를 발견했다면 알려주세요.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현할 수 있는 단계를 순서대로 작성해주세요.
      placeholder: |
        1. '...'로 이동
        2. '...'을 클릭
        3. '...'까지 스크롤
        4. 에러 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 원래 어떻게 동작해야 하는지 설명해주세요.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: 스크린샷
      description: 가능하다면 문제를 보여주는 스크린샷을 첨부해주세요.
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: 기기 / OS 정보
      placeholder: 예) Galaxy S23, Android 14
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 그 외 참고할 만한 내용이 있다면 작성해주세요.
    validations:
      required: false
