name: ✨ Feature Request
description: 새로운 기능이나 개선 아이디어를 제안해주세요.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 이 기능이 필요한 이유나 배경이 되는 문제를 설명해주세요.
      placeholder: 예) ~할 때 항상 불편함을 느낍니다.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: 제안하는 해결책
      description: 원하는 기능이나 동작을 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법을 고려해봤다면 설명해주세요.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 스크린샷, 참고 자료 등 추가로 공유할 내용이 있다면 작성해주세요.
    validations:
      required: false
